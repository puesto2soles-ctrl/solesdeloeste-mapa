<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Lotes - Puesto 2 (Soles del Oeste)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 10px;
            text-align: center;
        }
        h2 {
            color: #1a252f;
            font-size: 1.1rem;
            margin: 10px 0;
        }
        .control-box {
            background: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 10px;
            display: inline-block;
        }
        select, button {
            padding: 8px 10px;
            margin: 4px;
            font-size: 0.95rem;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            background: #27ae60;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #219653;
        }
        #mapa-container {
            position: relative;
            display: inline-block;
            max-width: 100%;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
        }
        #plano {
            width: 100%;
            max-width: 500px;
            height: auto;
            display: block;
        }
        #pin {
            position: absolute;
            width: 18px;
            height: 18px;
            background: #e74c3c;
            border: 2px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            display: none;
            box-shadow: 0 0 6px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>

    <h2>?? Localizador de Lotes - Puesto 2</h2>
    
    <div class="control-box">
        <label for="manzana">Manzana:</label>
        <select id="manzana">
            <option value="">Selecciona...</option>
            <option value="82">Manzana 82</option>
            <option value="83">Manzana 83</option>
            <option value="84">Manzana 84</option>
            <option value="85">Manzana 85</option>
            <option value="86">Manzana 86</option>
            <option value="87">Manzana 87</option>
            <option value="88">Manzana 88</option>
            <option value="89">Manzana 89</option>
            <option value="90">Manzana 90</option>
            <option value="91">Manzana 91</option>
            <option value="92">Manzana 92</option>
            <option value="93">Manzana 93</option>
            <option value="94">Manzana 94</option>
            <option value="95">Manzana 95</option>
            <option value="96">Manzana 96</option>
        </select>
        <button onclick="ubicarLote()">Marcar</button>
    </div>

    <div id="mapa-container">
        <!-- Apunta exactamente a la imagen con _2 -->
        <img id="plano" src="1000043402_2.jpg" alt="Plano Soles del Oeste">
        <div id="pin"></div>
    </div>

    <script>
        function ubicarLote() {
            var mz = document.getElementById("manzana").value;
            var pin = document.getElementById("pin");
            
            if (mz === "") {
                alert("Por favor selecciona una manzana.");
                pin.style.display = "none";
                return;
            }

            var coordenadas = {
                "82": { top: "82%", left: "20%" },
                "83": { top: "45%", left: "89%" },
                "84": { top: "72%", left: "83%" },
                "85": { top: "72%", left: "60%" },
                "86": { top: "87%", left: "41%" },
                "87": { top: "60%", left: "37%" },
                "88": { top: "42%", left: "43%" },
                "89": { top: "18%", left: "43%" },
                "90": { top: "18%", left: "69%" },
                "91": { top: "30%", left: "78%" },
                "92": { top: "33%", left: "64%" },
                "93": { top: "42%", left: "60%" },
                "94": { top: "60%", left: "57%" },
                "95": { top: "43%", left: "77%" },
                "96": { top: "72%", left: "37%" }
            };

            if (coordenadas[mz]) {
                pin.style.top = coordenadas[mz].top;
                pin.style.left = coordenadas[mz].left;
                pin.style.display = "block";
            } else {
                alert("Manzana no encontrada.");
                pin.style.display = "none";
            }
        }
    </script>

</body>
</html>
