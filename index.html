<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indicaciones dadas por el Puesto 2 (Soles del Oeste)</title>
    <!-- Librería para generar el código QR localmente -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 10px;
            text-align: center;
        }
        h2 {
            color: #1a252f;
            font-size: 1.1rem;
            margin: 10px 0;
        }
        .instruction-box {
            background: #e8f8f5;
            color: #117a65;
            padding: 10px 12px;
            border-radius: 6px;
            border: #a3e4d7 1px solid;
            display: inline-block;
            margin-bottom: 10px;
            font-size: 0.9rem;
            font-weight: bold;
            max-width: 450px;
        }
        .control-box {
            background: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 10px;
            display: inline-block;
        }
        button.action-btn {
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 5px;
            border: none;
            background: #27ae60;
            color: white;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
        }
        button.action-btn:hover {
            background: #219653;
        }
        button.reset-btn {
            background: #e74c3c;
            margin-left: 5px;
        }
        button.reset-btn:hover {
            background: #c0392b;
        }
        #mapa-container {
            position: relative;
            display: inline-block;
            max-width: 100%;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
            cursor: crosshair;
        }
        #plano {
            width: 100%;
            max-width: 500px;
            height: auto;
            display: block;
        }
        
        #svg-ruta {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        /* PIN ROJO (Destino) */
        #pin-destino {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #e74c3c;
            border: 2px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            display: none;
            box-shadow: 0 0 10px rgba(231, 76, 60, 0.9);
            z-index: 10;
            pointer-events: none;
            animation: pulsoRojo 1.5s infinite;
        }

        /* PIN AZUL (Puesto 2 - Fijo) */
        #pin-partida {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #3498db;
            border: 2px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            display: block;
            box-shadow: 0 0 10px rgba(52, 152, 219, 0.9);
            z-index: 10;
            pointer-events: none;
        }

        @keyframes pulsoRojo {
            0% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.8); }
            70% { box-shadow: 0 0 0 8px rgba(231, 76, 60, 0); }
            100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); }
        }

        #qr-container {
            margin-top: 15px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            max-width: 300px;
            margin-left: auto;
            margin-right: auto;
            display: none;
        }
        #qrcode {
            margin: 10px auto;
            display: flex;
            justify-content: center;
        }
        #resultado-texto {
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <h2 id="titulo-principal">📍 Creador Automático de Rutas - Puesto 2</h2>
    
    <div class="instruction-box" id="instruccion">
        🎯 <b>Modo Operativo:</b> Haz clic en cualquier lote del mapa para trazar la ruta automática desde el Puesto 2.
    </div>

    <div>
        <div id="mapa-container" onclick="manejarClicMapa(event)">
            <!-- Imagen del nuevo plano detallado -->
            <img id="plano" src="1000043549.jpg" alt="Plano Detallado Soles del Oeste" onload="inicializarSistema()">
            
            <!-- SVG para la polilínea automática -->
            <svg id="svg-ruta">
                <polyline id="camino-polyline" points="" stroke="#3498db" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
            </svg>

            <div id="pin-partida"></div>
            <div id="pin-destino"></div>
        </div>
    </div>

    <div class="control-box" id="panel-control" style="max-width: 400px; margin: 10px auto; display: block;">
        <label for="comentario">Nota para el destino (Opcional):</label><br>
        <input type="text" id="comentario" placeholder="Ej: Manzana / Lote / Propietario..." style="width: 85%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;">
        <br>
        <button class="action-btn" onclick="generarQR()">Generar QR Automático</button>
        <button class="action-btn reset-btn" onclick="reiniciarRuta()">Limpiar</button>
    </div>

    <!-- Contenedor del código QR -->
    <div id="qr-container">
        <div id="resultado-texto">Ruta generada</div>
        <p style="font-size: 0.8rem; color: #555; margin: 0;">Escanea con el celular para ver las indicaciones:</p>
        <div id="qrcode"></div>
    </div>

    <script>
        // Coordenadas fijas del Puesto 2 basadas en la nueva imagen (arriba a la derecha)
        var partidaX = 92.5; 
        var partidaY = 22.0;

        var destinoX = null;
        var destinoY = null;

        function inicializarSistema() {
            var urlParams = new URLSearchParams(window.location.search);
            var destX = urlParams.get('destX');
            var destY = urlParams.get('destY');
            var notaParam = urlParams.get('nota');

            // Posicionar el pin azul del Puesto 2
            var pinPart = document.getElementById("pin-partida");
            pinPart.style.left = partidaX + "%";
            pinPart.style.top = partidaY + "%";

            if (destX !== null && destY !== null) {
                // MODO VISITANTE (Abierto desde el QR)
                destinoX = parseFloat(destX);
                destinoY = parseFloat(destY);

                var pinDest = document.getElementById("pin-destino");
                pinDest.style.left = destinoX + "%";
                pinDest.style.top = destinoY + "%";
                pinDest.style.display = "block";

                // Trazar la ruta inteligente automática
                trazarRutaAutomatica(partidaX, partidaY, destinoX, destinoY);

                // Cambiar título y ocultar controles de la garita
                document.getElementById("titulo-principal").innerHTML = "📍 Indicaciones dadas por el Puesto 2";
                document.getElementById("panel-control").style.display = "none";
                
                var inst = document.getElementById("instruccion");
                inst.style.background = "#d4edda";
                inst.style.color = "#155724";
                inst.style.borderColor = "#c3e6cb";
                
                var mensajeDestino = notaParam ? decodeURIComponent(notaParam) : "Destino asignado";
                inst.innerHTML = "🧭 <b>Guía de Navegación:</b> Te encuentras en el punto azul (Puesto 2). Sigue la línea azul por las calles principales hasta el punto rojo en <b>" + mensajeDestino + "</b>.";
            }
        }

        function manejarClicMapa(event) {
            var urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('destX') !== null) return; // Bloquear si es vista de visitante

            var container = document.getElementById("mapa-container");
            var rect = container.getBoundingClientRect();
            
            destinoX = ((event.clientX - rect.left) / rect.width) * 100;
            destinoY = ((event.clientY - rect.top) / rect.height) * 100;

            // Mostrar Pin Rojo de Destino
            var pinDest = document.getElementById("pin-destino");
            pinDest.style.left = destinoX + "%";
            pinDest.style.top = destinoY + "%";
            pinDest.style.display = "block";

            // Calcular y dibujar automáticamente la ruta inteligente
            trazarRutaAutomatica(partidaX, partidaY, destinoX, destinoY);

            document.getElementById("qr-container").style.display = "none";
        }

        // Algoritmo inteligente que simula los quiebres naturales por las avenidas del barrio
        function trazarRutaAutomatica(x1, y1, x2, y2) {
            var img = document.getElementById("plano");
            var w = img.clientWidth;
            var h = img.clientHeight;

            // Convertir porcentajes a pixeles reales
            var px1 = (x1 / 100) * w;
            var py1 = (y1 / 100) * h;
            var px2 = (x2 / 100) * w;
            var py2 = (y2 / 100) * h;

            // Puntos intermedios inteligentes basados en la distribución vial de Soles del Oeste
            // Salimos del Puesto 2 hacia la arteria principal y bajamos o nos movemos en "L"
            var interX = px1; 
            var interY = py2; // Genera un giro limpio en escuadra por las calles

            // Si el destino está muy arriba a la derecha, ajustamos el quiebre para suavizar la traza
            if (Math.abs(px1 - px2) < 50) {
                interX = (px1 + px2) / 2;
                interY = (py1 + py2) / 2;
            }

            // Construir la cadena de puntos para la polilínea SVG
            var puntosSvg = px1 + "," + py1 + " " + interX + "," + interY + " " + px2 + "," + py2;

            var polyline = document.getElementById("camino-polyline");
            polyline.setAttribute("points", puntosSvg);
        }

        function reiniciarRuta() {
            destinoX = null;
            destinoY = null;
            document.getElementById("pin-destino").style.display = "none";
            document.getElementById("camino-polyline").setAttribute("points", "");
            document.getElementById("qr-container").style.display = "none";
            document.getElementById("comentario").value = "";
        }

        function generarQR() {
            if (destinoX === null || destinoY === null) {
                alert("Por favor, haz clic en el mapa para marcar el lote de destino.");
                return;
            }

            var nota = document.getElementById("comentario").value.trim();
            var baseUrl = window.location.origin + window.location.pathname;
            
            var linkFinal = baseUrl + "?destX=" + destinoX.toFixed(2) + "&destY=" + destinoY.toFixed(2);
            
            if (nota !== "") {
                linkFinal += "&nota=" + encodeURIComponent(nota);
            }

            var resultadoTexto = document.getElementById("resultado-texto");
            resultadoTexto.innerHTML = nota !== "" ? "Destino: " + nota : "Ruta generada";

            var qrcodeDiv = document.getElementById("qrcode");
            qrcodeDiv.innerHTML = "";
            
            new QRCode(qrcodeDiv, {
                text: linkFinal,
                width: 150,
                height: 150
            });

            document.getElementById("qr-container").style.display = "block";
        }
    </script>

</body>
</html>
