<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Lotes - Puesto 2 (Soles del Oeste)</title>
    <!-- Librería oficial para generar códigos QR locales sin fallos -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 10px;
            text-align: center;
        }
        h2 {
            color: #1a252f;
            font-size: 1.1rem;
            margin: 10px 0;
        }
        .control-box {
            background: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 10px;
            display: inline-block;
        }
        select, button {
            padding: 8px 10px;
            margin: 4px;
            font-size: 0.95rem;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            background: #27ae60;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #219653;
        }
        #mapa-container {
            position: relative;
            display: inline-block;
            max-width: 100%;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
        }
        #plano {
            width: 100%;
            max-width: 500px;
            height: auto;
            display: block;
        }
        #pin {
            position: absolute;
            width: 16px;
            height: 16px;
            background: #e74c3c;
            border: 2px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            display: none;
            box-shadow: 0 0 8px rgba(0,0,0,0.9);
            z-index: 10;
        }
        #qr-container {
            margin-top: 15px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: inline-block;
            max-width: 300px;
            display: none;
        }
        #qrcode {
            margin: 10px auto;
            display: flex;
            justify-content: center;
        }
        #resultado-texto {
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <h2>?? Localizador de Lotes - Puesto 2</h2>
    
    <div class="control-box">
        <label for="manzana">Manzana:</label>
        <select id="manzana" onchange="actualizarLotes()">
            <option value="">Manzana...</option>
            <option value="82">Manz. 82 (85 lotes)</option>
            <option value="83">Manz. 83 (23 lotes)</option>
            <option value="84">Manz. 84 (10 lotes)</option>
            <option value="85">Manz. 85 (23 lotes)</option>
            <option value="86">Manz. 86 (18 lotes)</option>
            <option value="87">Manz. 87 (23 lotes)</option>
            <option value="88">Manz. 88 (29 lotes)</option>
            <option value="89">Manz. 89 (28 lotes)</option>
            <option value="90">Manz. 90 (20 lotes)</option>
            <option value="91">Manz. 91 (7 lotes)</option>
            <option value="92">Manz. 92 (17 lotes)</option>
            <option value="93">Manz. 93 (13 lotes)</option>
            <option value="94">Manz. 94 (18 lotes)</option>
            <option value="95">Manz. 95 (28 lotes)</option>
            <option value="96">Manz. 96 (16 lotes)</option>
        </select>

        <label for="parcela">Lote:</label>
        <select id="parcela">
            <option value="">Lote...</option>
        </select>

        <button onclick="ubicarLote()">Marcar</button>
    </div>

    <div>
        <div id="mapa-container">
            <img id="plano" src="1000043402_2.jpg" alt="Plano Soles del Oeste">
            <div id="pin"></div>
        </div>
    </div>

    <!-- Contenedor del código QR local -->
    <div id="qr-container">
        <div id="resultado-texto">Destino seleccionado</div>
        <p style="font-size: 0.85rem; color: #555; margin: 0;">Escanea con el celular para guiar al personal:</p>
        <div id="qrcode"></div>
    </div>

    <script>
        var limitesLotes = {
            "82": 85, "83": 23, "84": 10, "85": 23, "86": 18, 
            "87": 23, "88": 29, "89": 28, "90": 20, "91": 7, 
            "92": 17, "93": 13, "94": 18, "95": 28, "96": 16
        };

        // Coordenadas base (inicio y fin) ajustadas de forma más precisa para el plano
        var coordenadasManzanas = {
            "82": { inicio: {top: 70, left: 15}, fin: {top: 95, left: 40} },
            "83": { inicio: {top: 35, left: 82}, fin: {top: 65, left: 82} },
            "84": { inicio: {top: 68, left: 75}, fin: {top: 75, left: 82} },
            "85": { inicio: {top: 62, left: 50}, fin: {top: 75, left: 62} },
            "86": { inicio: {top: 78, left: 35}, fin: {top: 92, left: 48} },
            "87": { inicio: {top: 50, left: 32}, fin: {top: 65, left: 42} },
            "88": { inicio: {top: 32, left: 38}, fin: {top: 48, left: 48} },
            "89": { inicio: {top: 12, left: 38}, fin: {top: 28, left: 48} },
            "90": { inicio: {top: 12, left: 62}, fin: {top: 28, left: 75} },
            "91": { inicio: {top: 26, left: 72}, fin: {top: 34, left: 82} },
            "92": { inicio: {top: 28, left: 55}, fin: {top: 40, left: 68} },
            "93": { inicio: {top: 36, left: 52}, fin: {top: 46, left: 62} },
            "94": { inicio: {top: 52, left: 48}, fin: {top: 65, left: 60} },
            "95": { inicio: {top: 38, left: 70}, fin: {top: 52, left: 82} },
            "96": { inicio: {top: 65, left: 32}, fin: {top: 75, left: 42} }
        };

        function actualizarLotes() {
            var mz = document.getElementById("manzana").value;
            var selectParcela = document.getElementById("parcela");
            selectParcela.innerHTML = '<option value="">Lote...</option>';
            
            if (mz !== "" && limitesLotes[mz]) {
                var total = limitesLotes[mz];
                for (var i = 1; i <= total; i++) {
                    var opt = document.createElement("option");
                    opt.value = i;
                    opt.innerHTML = "Lote " + i;
                    selectParcela.appendChild(opt);
                }
            }
        }

        function ubicarLote() {
            var mz = document.getElementById("manzana").value;
            var parcela = parseInt(document.getElementById("parcela").value);
            var pin = document.getElementById("pin");
            var qrContainer = document.getElementById("qr-container");
            var resultadoTexto = document.getElementById("resultado-texto");
            var qrcodeDiv = document.getElementById("qrcode");
            
            if (mz === "" || isNaN(parcela)) {
                alert("Por favor selecciona una manzana y un lote válido.");
                pin.style.display = "none";
                qrContainer.style.display = "none";
                return;
            }

            var datosMz = coordenadasManzanas[mz];
            var totalLotes = limitesLotes[mz];

            if (datosMz) {
                // Interpolación proporcional exacta dentro de la manzana
                var proporcion = (parcela - 1) / (totalLotes > 1 ? (totalLotes - 1) : 1);
                
                var topActual = datosMz.inicio.top + (datosMz.fin.top - datosMz.inicio.top) * proporcion;
                var leftActual = datosMz.inicio.left + (datosMz.fin.left - datosMz.inicio.left) * proporcion;

                pin.style.top = topActual + "%";
                pin.style.left = leftActual + "%";
                pin.style.display = "block";

                // Texto del destino
                var textoUbicacion = "Soles del Oeste - Manzana " + mz + ", Lote " + parcela;
                resultadoTexto.innerHTML = "Manzana " + mz + " - Lote " + parcela;

                // Limpiar QR anterior y generar uno nuevo de forma local
                qrcodeDiv.innerHTML = "";
                new QRCode(qrcodeDiv, {
                    text: textoUbicacion,
                    width: 130,
                    height: 130
                });

                qrContainer.style.display = "inline-block";
            } else {
                alert("Coordenadas no configuradas para esta manzana.");
                pin.style.display = "none";
                qrContainer.style.display = "none";
            }
        }
    </script>

</body>
</html>
