<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Lotes - Soles del Oeste (Puesto 2)</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 15px; text-align: center; }
        h2 { color: #2c3e50; font-size: 1.2rem; }
        .control-box { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; display: inline-block; }
        select, button { padding: 8px 12px; margin: 5px; font-size: 1rem; border-radius: 4px; border: 1px solid #ccc; }
        button { background: #27ae60; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #219653; }
        #mapa-container { position: relative; display: inline-block; max-width: 100%; border: 2px solid #ccc; border-radius: 8px; overflow: hidden; background: #fff; }
        #plano { width: 100%; max-width: 600px; height: auto; display: block; }
        /* Pin rojo dinámico que se ubicará según coordenadas */
        #pin { position: absolute; width: 20px; height: 20px; background: red; border: 2px solid white; border-radius: 50%; transform: translate(-50%, -50%); display: none; box-shadow: 0 0 5px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <h2>?? Localizador Rápido de Lotes - Puesto 2</h2>
    
    <div class="control-box">
        <label for="manzana">Manzana:</label>
        <select id="manzana">
            <option value="">Selecciona Manzana...</option>
            <option value="82">Manzana 82</option>
            <option value="88">Manzana 88</option>
            <option value="90">Manzana 90</option>
            <option value="92">Manzana 92</option>
            <!-- Puedes agregar el resto de las manzanas aquí -->
        </select>

        <button onclick="ubicarLote()">Marcar en Plano</button>
    </div>

    <div id="mapa-container">
        <!-- Aquí va la imagen del plano del barrio -->
        <img id="plano" src="1000020401.jpg" alt="Plano Soles del Oeste">
        <div id="pin"></div>
    </div>

    <script>
        function ubicarLote() {
            var mz = document.getElementById("manzana").value;
            var pin = document.getElementById("pin");
            
            if (mz === "") {
                alert("Por favor selecciona una manzana.");
                pin.style.display = "none";
                return;
            }

            // Coordenadas aproximadas de ejemplo sobre la imagen (en porcentaje %)
            // Aquí puedes calibrar exactamente dónde cae cada manzana en tu imagen del plano
            var coordenadas = {
                "82": { top: "12%", left: "25%" },
                "88": { top: "60%", left: "38%" },
                "90": { top: "18%", left: "68%" },
                "92": { top: "38%", left: "60%" }
            };

            if (coordenadas[mz]) {
                pin.style.top = coordenadas[mz].top;
                pin.style.left = coordenadas[mz].left;
                pin.style.display = "block";
            } else {
                alert("Coordenadas no configuradas aún para esta manzana.");
                pin.style.display = "none";
            }
        }
    </script>

</body>
</html>
