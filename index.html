<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navegador Automático por Calles - Soles del Oeste</title>
    
    <!-- Estilos CSS de Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Estilos CSS de Leaflet Routing Machine (Ruteo automático) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    
    <!-- Librería para generar códigos QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 10px; 
            text-align: center; 
            background: #f0f2f5; 
        }
        h2 {
            color: #1a252f;
            font-size: 1.1rem;
            margin: 10px 0;
        }
        .instruction-box {
            background: #e8f8f5;
            color: #117a65;
            padding: 10px 12px;
            border-radius: 6px;
            border: #a3e4d7 1px solid;
            display: inline-block;
            margin-bottom: 10px;
            font-size: 0.9rem;
            font-weight: bold;
            max-width: 450px;
        }
        #map { 
            width: 100%; 
            max-width: 600px; 
            height: 55vh; 
            margin: 0 auto; 
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .control-panel { 
            margin-top: 15px;
            padding: 12px; 
            background: white; 
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: inline-block;
            max-width: 450px;
        }
        .puestos-selector {
            margin-bottom: 10px;
        }
        .puestos-selector button {
            padding: 6px 10px;
            margin: 2px;
            font-size: 0.8rem;
            border: 1px solid #bdc3c7;
            background: #ecf0f1;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .puestos-selector button.activo {
            background: #3498db;
            color: white;
            border-color: #2980b9;
        }
        button.action-btn {
            padding: 8px 16px;
            font-size: 0.95rem;
            border-radius: 5px;
            border: none;
            background: #27ae60;
            color: white;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
        }
        button.action-btn:hover { background: #219653; }
        button.reset-btn { background: #e74c3c; margin-left: 5px; }
        button.reset-btn:hover { background: #c0392b; }

        .leaflet-routing-container {
            display: none !important;
        }

        #qr-container {
            margin-top: 15px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            max-width: 300px;
            margin-left: auto;
            margin-right: auto;
            display: none;
        }
        #qrcode {
            margin: 10px auto;
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>

    <h2>📍 Navegador Automático por Calles - Soles del Oeste</h2>
    
    <div class="instruction-box" id="instruccion">
        🎯 Selecciona el puesto de origen y haz clic en cualquier punto del barrio para calcular la ruta exacta por las calles.
    </div>

    <!-- Contenedor del Mapa -->
    <div id="map"></div>

    <div class="control-panel">
        <div class="puestos-selector">
            <span style="font-size: 0.85rem; font-weight: bold; display: block; margin-bottom: 4px;">Puesto de Origen:</span>
            <button type="button" id="btn-principal" class="activo" onclick="cambiarPuesto('Puesto Principal', -33.111862, -64.401485)">Principal</button>
            <button type="button" id="btn-p1" onclick="cambiarPuesto('Puesto 1', -33.116553, -64.405181)">Puesto 1</button>
            <button type="button" id="btn-p2" onclick="cambiarPuesto('Puesto 2', -33.120714, -64.405171)">Puesto 2</button>
        </div>

        <label for="comentario" style="font-size: 0.85rem;">Nota para el destino (Opcional):</label><br>
        <input type="text" id="comentario" placeholder="Ej: Manzana / Lote / Propietario..." style="width: 85%; padding: 6px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;">
        <br>
        <button class="action-btn" onclick="generarQR()">Generar QR</button>
        <button class="action-btn reset-btn" onclick="reiniciarRuta()">Limpiar</button>
    </div>

    <!-- Contenedor del QR -->
    <div id="qr-container">
        <div id="resultado-texto" style="font-weight: bold; font-size: 0.9rem; color: #2c3e50;">Ruta generada</div>
        <p style="font-size: 0.8rem; color: #555; margin: 5px 0;">Escanea con el celular:</p>
        <div id="qrcode"></div>
    </div>

    <!-- Scripts de Leaflet y del Motor de Ruteo Automático (OSRM) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    <script>
        var map = L.map('map').setView([-33.115, -64.403], 15);

        // Capa base de OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // --- LÍMITES CALIBRADOS PARA EL PLANO ---
        var imageBounds = [
            [-33.123500, -64.407500], // Esquina Suroeste
            [-33.110000, -64.398000]  // Esquina Noreste
        ];
        
        var imageUrl = 'sol1.png';
        L.imageOverlay(imageUrl, imageBounds, {
            opacity: 0.9,
            interactive: true
        }).addTo(map);

        // --- MARCADORES VISIBLES DE LOS PUESTOS ---
        var markerPrincipal = L.marker([-33.111862, -64.401485]).addTo(map)
            .bindPopup('<b>Puesto Principal</b>');

        var markerPuesto1 = L.marker([-33.116553, -64.405181]).addTo(map)
            .bindPopup('<b>Puesto 1</b>');

        var markerPuesto2 = L.marker([-33.120714, -64.405171]).addTo(map)
            .bindPopup('<b>Puesto 2</b>');

        var puestoActual = "Puesto Principal";
        var coordOrigen = [-33.111862, -64.401485];
        var controlRuta = null;
        var destinoLatLon = null;

        function cambiarPuesto(nombre, lat, lng) {
            puestoActual = nombre;
            coordOrigen = [lat, lng];

            document.getElementById("btn-principal").className = (nombre === "Puesto Principal") ? "activo" : "";
            document.getElementById("btn-p1").className = (nombre === "Puesto 1") ? "activo" : "";
            document.getElementById("btn-p2").className = (nombre === "Puesto 2") ? "activo" : "";

            map.setView(coordOrigen, 16);

            if (destinoLatLon) {
                trazarRutaOSRM(destinoLatLon);
            }
        }

        map.on('click', function(e) {
            destinoLatLon = e.latlng;
            trazarRutaOSRM(destinoLatLon);
            document.getElementById("qr-container").style.display = "none";
        });

        function trazarRutaOSRM(dest) {
            if (controlRuta) {
                map.removeControl(controlRuta);
            }

            controlRuta = L.Routing.control({
                waypoints: [
                    L.latLng(coordOrigen[0], coordOrigen[1]),
                    L.latLng(dest.lat, dest.lng)
                ],
                routeWhileDragging: false,
                addWaypoints: false,
                draggableWaypoints: false,
                fitSelectedRoutes: false,
                show: false,
                lineOptions: {
                    styles: [{ color: '#3498db', weight: 5, opacity: 0.8 }]
                }
            }).addTo(map);
        }

        function reiniciarRuta() {
            if (controlRuta) {
                map.removeControl(controlRuta);
                controlRuta = null;
            }
            destinoLatLon = null;
            document.getElementById("qr-container").style.display = "none";
            document.getElementById("comentario").value = "";
        }

        function generarQR() {
            if (!destinoLatLon) { alert("Haz clic en el mapa para marcar un destino."); return; }
            var nota = document.getElementById("comentario").value.trim();
            var baseUrl = window.location.origin + window.location.pathname;

            var linkFinal = baseUrl + "?lat=" + destinoLatLon.lat.toFixed(6) + "&lng=" + destinoLatLon.lng.toFixed(6) + 
                          "&puesto=" + encodeURIComponent(puestoActual) + 
                          "&olat=" + coordOrigen[0] + "&olng=" + coordOrigen[1];
            if (nota !== "") linkFinal += "&nota=" + encodeURIComponent(nota);

            document.getElementById("resultado-texto").innerHTML = "Ruta desde " + puestoActual + (nota ? " (" + nota + ")" : "");
            var qrcodeDiv = document.getElementById("qrcode");
            qrcodeDiv.innerHTML = "";
            new QRCode(qrcodeDiv, { text: linkFinal, width: 140, height: 140 });
            document.getElementById("qr-container").style.display = "block";
        }

        window.onload = function() {
            var urlParams = new URLSearchParams(window.location.search);
            var lat = urlParams.get('lat'), lng = urlParams.get('lng'), puestoParam = urlParams.get('puesto');
            var olat = urlParams.get('olat'), olng = urlParams.get('olng'), notaParam = urlParams.get('nota');

            if (lat !== null && lng !== null) {
                if (olat !== null && olng !== null) coordOrigen = [parseFloat(olat), parseFloat(olng)];
                if (puestoParam) puestoActual = decodeURIComponent(puestoParam);

                destinoLatLon = L.latLng(parseFloat(lat), parseFloat(lng));
                trazarRutaOSRM(destinoLatLon);
                map.setView(coordOrigen, 16);

                document.querySelector(".control-panel").style.display = "none";
                var mensajeDestino = notaParam ? decodeURIComponent(notaParam) : "Destino asignado";
                document.getElementById("instruccion").innerHTML = "🧭 Sigue la ruta marcada desde el <b>" + puestoActual + "</b> hacia <b>" + mensajeDestino + "</b>.";
                document.querySelector("h2").innerHTML = "📍 Indicaciones de Guía";
            }
        };
    </script>
</body>
</html>
