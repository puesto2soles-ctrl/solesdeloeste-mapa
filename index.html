<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guía GPS - Puesto 2 (Soles del Oeste)</title>
    <!-- Librería para generar el código QR de forma local -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 10px;
            text-align: center;
        }
        h2 {
            color: #1a252f;
            font-size: 1.1rem;
            margin: 10px 0;
        }
        .instruction-box {
            background: #e8f8f5;
            color: #117a65;
            padding: 10px 12px;
            border-radius: 6px;
            border: #a3e4d7 1px solid;
            display: inline-block;
            margin-bottom: 10px;
            font-size: 0.9rem;
            font-weight: bold;
            max-width: 450px;
        }
        .control-box {
            background: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 10px;
            display: inline-block;
        }
        button {
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 5px;
            border: none;
            background: #27ae60;
            color: white;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover {
            background: #219653;
        }
        #mapa-container {
            position: relative;
            display: inline-block;
            max-width: 100%;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
            cursor: crosshair;
        }
        #plano {
            width: 100%;
            max-width: 500px;
            height: auto;
            display: block;
        }
        
        /* PIN DE 6 PÍXELES CON PULSO LUMINOSO (Destino) */
        #pin {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #e74c3c;
            border: 1.5px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            display: none;
            box-shadow: 0 0 8px rgba(231, 76, 60, 0.9);
            z-index: 10;
            pointer-events: none;
            animation: pulso 1.5s infinite;
        }

        @keyframes pulso {
            0% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.8); }
            70% { box-shadow: 0 0 0 6px rgba(231, 76, 60, 0); }
            100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); }
        }

        #qr-container {
            margin-top: 15px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            max-width: 300px;
            margin-left: auto;
            margin-right: auto;
            display: none;
        }
        #qrcode {
            margin: 10px auto;
            display: flex;
            justify-content: center;
        }
        #resultado-texto {
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <h2>📍 Localizador y Guía GPS - Puesto 2</h2>
    
    <div class="instruction-box" id="instruccion">
        👆 Haz clic en el plano donde va el visitante y presiona generar QR.
    </div>

    <div>
        <div id="mapa-container" onclick="marcarPunto(event)">
            <img id="plano" src="1000043402_2.jpg" alt="Plano Soles del Oeste">
            <div id="pin"></div>
        </div>
    </div>

    <div class="control-box" id="panel-control" style="max-width: 400px; margin: 10px auto; display: block;">
        <label for="comentario">Nota para el destino (Opcional):</label><br>
        <input type="text" id="comentario" placeholder="Ej: Visita Manzana / Lote..." style="width: 85%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;">
        <br>
        <button onclick="generarQR()">Generar QR con el Punto Marcado</button>
    </div>

    <!-- Contenedor del código QR -->
    <div id="qr-container">
        <div id="resultado-texto">Destino marcado</div>
        <p style="font-size: 0.8rem; color: #555; margin: 0;">Escanea con el celular para abrir la guía GPS:</p>
        <div id="qrcode"></div>
    </div>

    <script>
        var posX = null;
        var posY = null;

        window.onload = function() {
            var urlParams = new URLSearchParams(window.location.search);
            var xParam = urlParams.get('x');
            var yParam = urlParams.get('y');
            var notaParam = urlParams.get('nota');

            if (xParam !== null && yParam !== null) {
                posX = parseFloat(xParam);
                posY = parseFloat(yParam);

                var pin = document.getElementById("pin");
                pin.style.left = posX + "%";
                pin.style.top = posY + "%";
                pin.style.display = "block";

                document.getElementById("panel-control").style.display = "none";
                var inst = document.getElementById("instruccion");
                inst.style.background = "#d4edda";
                inst.style.color = "#155724";
                inst.style.borderColor = "#c3e6cb";
                
                var mensajeDestino = notaParam ? decodeURIComponent(notaParam) : "Destino asignado";
                inst.innerHTML = "🎯 <b>Destino:</b> " + mensajeDestino + "<br><span style='font-size: 0.8rem;'>Activando GPS para orientarte...</span>";

                // Activar geolocalización del visitante en tiempo real
                iniciarGPSVisitor();
            }
        };

        function marcarPunto(event) {
            var urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('x') !== null) return;

            var container = document.getElementById("mapa-container");
            var rect = container.getBoundingClientRect();
            
            var x = event.clientX - rect.left;
            var y = event.clientY - rect.top;
            
            posX = (x / rect.width) * 100;
            posY = (y / rect.height) * 100;

            var pin = document.getElementById("pin");
            pin.style.left = posX + "%";
            pin.style.top = posY + "%";
            pin.style.display = "block";
            
            document.getElementById("qr-container").style.display = "none";
        }

        function generarQR() {
            if (posX === null || posY === null) {
                alert("Por favor, haz primero clic sobre el plano para marcar el destino.");
                return;
            }

            var nota = document.getElementById("comentario").value.trim();
            var baseUrl = window.location.origin + window.location.pathname;
            var linkFinal = baseUrl + "?x=" + posX.toFixed(2) + "&y=" + posY.toFixed(2);
            
            if (nota !== "") {
                linkFinal += "&nota=" + encodeURIComponent(nota);
            }

            var resultadoTexto = document.getElementById("resultado-texto");
            resultadoTexto.innerHTML = nota !== "" ? "Destino: " + nota : "Destino marcado";

            var qrcodeDiv = document.getElementById("qrcode");
            qrcodeDiv.innerHTML = "";
            
            new QRCode(qrcodeDiv, {
                text: linkFinal,
                width: 150,
                height: 150
            });

            document.getElementById("qr-container").style.display = "block";
        }

        // Función para rastrear la posición GPS del visitante en su celular
        function iniciarGPSVisitor() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(
                    function(position) {
                        var lat = position.coords.latitude;
                        var lon = position.coords.longitude;
                        
                        // Aquí el GPS está activo. Como el plano es una imagen interna del barrio y no un mapa satelital global,
                        // podemos mostrar el estado de conexión GPS o utilizar las coordenadas para futuras referencias internas.
                        var inst = document.getElementById("instruccion");
                        var notaParam = new URLSearchParams(window.location.search).get('nota');
                        var mensajeDestino = notaParam ? decodeURIComponent(notaParam) : "Destino asignado";
                        
                        inst.innerHTML = "🎯 <b>Destino:</b> " + mensajeDestino + "<br><span style='color: #27ae60;'>🟢 GPS Conectado - Sigue el punto rojo marcado en el plano.</span>";
                    },
                    function(error) {
                        console.warn("Error de GPS: " + error.message);
                        var inst = document.getElementById("instruccion");
                        var notaParam = new URLSearchParams(window.location.search).get('nota');
                        var mensajeDestino = notaParam ? decodeURIComponent(notaParam) : "Destino asignado";
                        
                        inst.innerHTML = "🎯 <b>Destino:</b> " + mensajeDestino + "<br><span style='color: #e67e22;'>⚠️ Activa la ubicación en tu celular para una mejor guía.</span>";
                    },
                    { enableHighAccuracy: true, maximumAge: 10000, timeout: 5000 }
                );
            } else {
                console.warn("La geolocalización no está soportada en este navegador.");
            }
        }
    </script>

</body>
</html>
