<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Lotes - Puesto 2 (Soles del Oeste)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 10px;
            text-align: center;
        }
        h2 {
            color: #1a252f;
            font-size: 1.1rem;
            margin: 10px 0;
        }
        .control-box {
            background: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 10px;
            display: inline-block;
        }
        select, button {
            padding: 8px 10px;
            margin: 4px;
            font-size: 0.95rem;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            background: #27ae60;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #219653;
        }
        #mapa-container {
            position: relative;
            display: inline-block;
            max-width: 100%;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
        }
        #plano {
            width: 100%;
            max-width: 500px;
            height: auto;
            display: block;
        }
        #pin {
            position: absolute;
            width: 16px;
            height: 16px;
            background: #e74c3c;
            border: 2px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            display: none;
            box-shadow: 0 0 6px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>

    <h2>?? Localizador de Manzanas y Lotes - Puesto 2</h2>
    
    <div class="control-box">
        <label for="manzana">Manzana:</label>
        <select id="manzana" onchange="actualizarLotes()">
            <option value="">Manzana...</option>
            <option value="82">Manz. 82 (Lotes 1 al 82+)</option>
            <option value="83">Manz. 83 (Lotes 1 al 5)</option>
            <option value="84">Manz. 84 (Lotes 1 al 28)</option>
            <option value="85">Manz. 85 (Lotes 1 al 23)</option>
            <option value="86">Manz. 86 (Lotes 1 al 18)</option>
            <option value="87">Manz. 87 (Lotes 1 al 23)</option>
            <option value="88">Manz. 88 (Lotes 1 al 29)</option>
            <option value="89">Manz. 89 (Lotes 1 al 16)</option>
            <option value="90">Manz. 90 (Lotes 1 al 20)</option>
            <option value="91">Manz. 91 (Lotes 1 al 26)</option>
            <option value="92">Manz. 92 (Lotes 1 al 28)</option>
            <option value="93">Manz. 93 (Lotes 1 al 13)</option>
            <option value="94">Manz. 94 (Lotes 1 al 18)</option>
            <option value="95">Manz. 95 (Lotes 1 al 10)</option>
            <option value="96">Manz. 96 (Lotes 1 al 16)</option>
        </select>

        <label for="parcela">Lote:</label>
        <select id="parcela">
            <option value="">Lote...</option>
        </select>

        <button onclick="ubicarLote()">Marcar</button>
    </div>

    <div id="mapa-container">
        <img id="plano" src="1000043402_2.jpg" alt="Plano Soles del Oeste">
        <div id="pin"></div>
    </div>

    <script>
        // Límites actualizados de lotes por manzana (incluyendo la extensión de la 82 tras el descampado)
        var limitesLotes = {
            "82": 85,
            "83": 5,
            "84": 28,
            "85": 23,
            "86": 18,
            "87": 23,
            "88": 29,
            "89": 16,
            "90": 20,
            "91": 26,
            "92": 28,
            "93": 13,
            "94": 18,
            "95": 10,
            "96": 16
        };

        function actualizarLotes() {
            var mz = document.getElementById("manzana").value;
            var selectParcela = document.getElementById("parcela");
            selectParcela.innerHTML = '<option value="">Lote...</option>';
            
            if (mz !== "" && limitesLotes[mz]) {
                var total = limitesLotes[mz];
                for (var i = 1; i <= total; i++) {
                    var opt = document.createElement("option");
                    opt.value = i;
                    opt.innerHTML = "Lote " + i;
                    selectParcela.appendChild(opt);
                }
            }
        }

        function ubicarLote() {
            var mz = document.getElementById("manzana").value;
            var parcela = document.getElementById("parcela").value;
            var pin = document.getElementById("pin");
            
            if (mz === "") {
                alert("Por favor selecciona una manzana.");
                pin.style.display = "none";
                return;
            }

            // Coordenadas centrales de referencia para cada manzana en el plano
            var coordenadasManzanas = {
                "82": { top: "82%", left: "20%" },
                "83": { top: "45%", left: "89%" },
                "84": { top: "72%", left: "83%" },
                "85": { top: "72%", left: "60%" },
                "86": { top: "87%", left: "41%" },
                "87": { top: "60%", left: "37%" },
                "88": { top: "42%", left: "43%" },
                "89": { top: "18%", left: "43%" },
                "90": { top: "18%", left: "69%" },
                "91": { top: "30%", left: "78%" },
                "92": { top: "33%", left: "64%" },
                "93": { top: "42%", left: "60%" },
                "94": { top: "60%", left: "57%" },
                "95": { top: "43%", left: "77%" },
                "96": { top: "72%", left: "37%" }
            };

            if (coordenadasManzanas[mz]) {
                pin.style.top = coordenadasManzanas[mz].top;
                pin.style.left = coordenadasManzanas[mz].left;
                pin.style.display = "block";
            } else {
                alert("Manzana no encontrada.");
                pin.style.display = "none";
            }
        }
    </script>

</body>
</html>
