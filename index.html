<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Localizador Visual por Click - Puesto 2 (Soles del Oeste)</title>
    <!-- Librería oficial para generar códigos QR locales -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 10px;
            text-align: center;
        }
        h2 {
            color: #1a252f;
            font-size: 1.1rem;
            margin: 10px 0;
        }
        .instruction-box {
            background: #fff3cd;
            color: #856404;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #ffeeba;
            display: inline-block;
            margin-bottom: 10px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .control-box {
            background: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 10px;
            display: block;
        }
        button {
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 5px;
            border: none;
            background: #27ae60;
            color: white;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover {
            background: #219653;
        }
        #mapa-container {
            position: relative;
            display: inline-block;
            max-width: 100%;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
            cursor: crosshair; /* Muestra una cruz para indicar que se puede hacer clic */
        }
        #plano {
            width: 100%;
            max-width: 500px;
            height: auto;
            display: block;
        }
        #pin {
            position: absolute;
            width: 16px;
            height: 16px;
            background: #e74c3c;
            border: 2px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            display: none;
            box-shadow: 0 0 8px rgba(0,0,0,0.9);
            z-index: 10;
            pointer-events: none;
        }
        #qr-container {
            margin-top: 15px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            max-width: 300px;
            margin-left: auto;
            margin-right: auto;
            display: none;
        }
        #qrcode {
            margin: 10px auto;
            display: flex;
            justify-content: center;
        }
        #resultado-texto {
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <h2>📍 Localizador Táctico - Puesto 2</h2>
    
    <div class="instruction-box">
        👆 Haz clic directamente sobre el plano en el lugar exacto que visita el ingreso.
    </div>

    <div>
        <div id="mapa-container" onclick="marcarPunto(event)">
            <img id="plano" src="1000043402_2.jpg" alt="Plano Soles del Oeste">
            <div id="pin"></div>
        </div>
    </div>

    <div class="control-box" style="max-width: 400px; margin: 10px auto;">
        <label for="comentario">Nota o Destino (Opcional):</label><br>
        <input type="text" id="comentario" placeholder="Ej: Visita Lote / Manzana..." style="width: 80%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;">
        <br>
        <button onclick="generarQR()">Generar QR para el Visitante</button>
    </div>

    <!-- Contenedor del código QR generado -->
    <div id="qr-container">
        <div id="resultado-texto">Destino marcado</div>
        <p style="font-size: 0.8rem; color: #555; margin: 0;">Escanea este código para guiar al visitante:</p>
        <div id="qrcode"></div>
    </div>

    <script>
        // Variables para guardar las coordenadas porcentuales del último clic
        var posX = null;
        var posY = null;

        function marcarPunto(event) {
            var container = document.getElementById("mapa-container");
            var rect = container.getBoundingClientRect();
            
            // Obtener coordenadas relativas dentro de la imagen en porcentaje (0% a 100%)
            var x = event.clientX - rect.left;
            var y = event.clientY - rect.top;
            
            posX = (x / rect.width) * 100;
            posY = (y / rect.height) * 100;

            // Posicionar el pin rojo visualmente
            var pin = document.getElementById("pin");
            pin.style.left = posX + "%";
            pin.style.top = posY + "%";
            pin.style.display = "block";
            
            // Ocultar el QR anterior hasta que se vuelva a presionar el botón de generar
            document.getElementById("qr-container").style.display = "none";
        }

        function generarQR() {
            if (posX === null || posY === null) {
                alert("Por favor, haz primero clic sobre el plano para marcar el destino del visitante.");
                return;
            }

            var nota = document.getElementById("comentario").value.trim();
            var detalleDestino = nota !== "" ? nota : "Destino en Soles del Oeste";

            // Crear el texto que contendrá el QR (incluye las coordenadas exactas de la marca)
            var dataQR = "Soles del Oeste - Puesto 2\nDestino: " + detalleDestino + "\nCoord X: " + posX.toFixed(1) + "%, Y: " + posY.toFixed(1) + "%";

            var resultadoTexto = document.getElementById("resultado-texto");
            resultadoTexto.innerHTML = "QR Generado: " + detalleDestino;

            var qrcodeDiv = document.getElementById("qrcode");
            qrcodeDiv.innerHTML = "";
            
            // Generar el código QR localmente
            new QRCode(qrcodeDiv, {
                text: dataQR,
                width: 140,
                height: 140
            });

            document.getElementById("qr-container").style.display = "block";
        }
    </script>

</body>
</html>
