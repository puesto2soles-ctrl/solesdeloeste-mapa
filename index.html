<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navegador Dinámico - Soles del Oeste</title>
    
    <!-- Estilos CSS de Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Librería para generar códigos QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 10px; 
            text-align: center; 
            background: #f0f2f5; 
        }
        h2 {
            color: #1a252f;
            font-size: 1.1rem;
            margin: 10px 0;
        }
        .instruction-box {
            background: #e8f8f5;
            color: #117a65;
            padding: 10px 12px;
            border-radius: 6px;
            border: #a3e4d7 1px solid;
            display: inline-block;
            margin-bottom: 10px;
            font-size: 0.9rem;
            font-weight: bold;
            max-width: 450px;
        }
        #map { 
            width: 100%; 
            max-width: 600px; 
            height: 55vh; 
            margin: 0 auto; 
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            background: #ffffff;
        }
        .control-panel { 
            margin-top: 15px;
            padding: 12px; 
            background: white; 
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: inline-block;
            max-width: 450px;
        }
        button.action-btn {
            padding: 8px 16px;
            font-size: 0.95rem;
            border-radius: 5px;
            border: none;
            background: #27ae60;
            color: white;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
        }
        button.action-btn:hover { background: #219653; }
        button.reset-btn { background: #e74c3c; margin-left: 5px; }
        button.reset-btn:hover { background: #c0392b; }

        #qr-container {
            margin-top: 15px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            max-width: 300px;
            margin-left: auto;
            margin-right: auto;
            display: none;
        }
        #qrcode {
            margin: 10px auto;
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>

    <h2>📍 Marcador de Ubicación - Soles del Oeste</h2>
    
    <div class="instruction-box" id="instruccion">
        🔴 <b>Paso 1:</b> Haz clic en el plano para marcar <b>dónde se encuentran ahora mismo</b>.
    </div>

    <!-- Contenedor exclusivo para tu PNG -->
    <div id="map"></div>

    <div class="control-panel">
        <label for="comentario" style="font-size: 0.85rem;">Nota para el destino (Opcional):</label><br>
        <input type="text" id="comentario" placeholder="Ej: Manzana / Lote / Propietario..." style="width: 85%; padding: 6px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;">
        <br>
        <button class="action-btn" onclick="generarQR()">Generar QR</button>
        <button class="action-btn reset-btn" onclick="reiniciarRuta()">Limpiar</button>
    </div>

    <!-- Contenedor del QR -->
    <div id="qr-container">
        <div id="resultado-texto" style="font-weight: bold; font-size: 0.9rem; color: #2c3e50;">Puntos marcados</div>
        <p style="font-size: 0.80rem; color: #555; margin: 5px 0;">Escanea con el celular:</p>
        <div id="qrcode"></div>
    </div>

    <!-- Scripts de Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -1,
            maxZoom: 3
        });

        var h = 1000; 
        var w = 1000; 
        var imageBounds = [[0, 0], [h, w]];

        var imageUrl = 'sol1.png';
        L.imageOverlay(imageUrl, imageBounds).addTo(map);

        map.fitBounds(imageBounds);

        var origenPunto = null;
        var destinoPunto = null;
        var markerOrigen = null;
        var markerDestino = null;

        map.on('click', function(e) {
            if (!origenPunto) {
                origenPunto = e.latlng;
                
                var redIcon = L.divIcon({
                    className: 'custom-red-marker',
                    html: '<div style="background-color: #e74c3c; width: 14px; height: 14px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 4px rgba(0,0,0,0.6);"></div>',
                    iconSize: [14, 14],
                    iconAnchor: [7, 7]
                });

                markerOrigen = L.marker([origenPunto.lat, origenPunto.lng], {icon: redIcon}).addTo(map)
                    .bindPopup('<b>📍 Tu Ubicación Actual</b>').openPopup();

                document.getElementById("instruccion").innerHTML = "🎯 <b>Paso 2:</b> Ahora haz clic en el plano para marcar el <b>destino</b>.";
            
            } else if (!destinoPunto) {
                destinoPunto = e.latlng;

                markerDestino = L.marker([destinoPunto.lat, destinoPunto.lng]).addTo(map)
                    .bindPopup('<b>Destino Seleccionado</b>').openPopup();

                document.getElementById("instruccion").innerHTML = "✅ Puntos marcados. Presiona <b>Generar QR</b> o <b>Limpiar</b> para empezar de nuevo.";
            }
        });

        function reiniciarRuta() {
            if (markerOrigen) { map.removeLayer(markerOrigen); markerOrigen = null; }
            if (markerDestino) { map.removeLayer(markerDestino); markerDestino = null; }
            
            origenPunto = null;
            destinoPunto = null;
            document.getElementById("qr-container").style.display = "none";
            document.getElementById("comentario").value = "";
            document.getElementById("instruccion").innerHTML = "🔴 <b>Paso 1:</b> Haz clic en el plano para marcar <b>dónde se encuentran ahora mismo</b>.";
        }

        function generarQR() {
            if (!origenPunto || !destinoPunto) { 
                alert("Debes marcar primero tu ubicación actual y luego el destino en el plano."); 
                return; 
            }
            var nota = document.getElementById("comentario").value.trim();
            var baseUrl = window.location.origin + window.location.pathname;

            var linkFinal = baseUrl + "?olat=" + origenPunto.lat.toFixed(2) + "&olng=" + origenPunto.lng.toFixed(2) + 
                          "&dlat=" + destinoPunto.lat.toFixed(2) + "&dlng=" + destinoPunto.lng.toFixed(2);
            if (nota !== "") linkFinal += "&nota=" + encodeURIComponent(nota);

            document.getElementById("resultado-texto").innerHTML = "Ubicación y destino" + (nota ? " (" + nota + ")" : "");
            var qrcodeDiv = document.getElementById("qrcode");
            qrcodeDiv.innerHTML = "";
            new QRCode(qrcodeDiv, { text: linkFinal, width: 140, height: 140 });
            document.getElementById("qr-container").style.display = "block";
        }

        window.onload = function() {
            var urlParams = new URLSearchParams(window.location.search);
            var olat = urlParams.get('olat'), olng = urlParams.get('olng');
            var dlat = urlParams.get('dlat'), dlng = urlParams.get('dlng');
            var notaParam = urlParams.get('nota');

            if (olat !== null && dlat !== null) {
                origenPunto = L.latLng(parseFloat(olat), parseFloat(olng));
                destinoPunto = L.latLng(parseFloat(dlat), parseFloat(dlng));

                var redIcon = L.divIcon({
                    className: 'custom-red-marker',
                    html: '<div style="background-color: #e74c3c; width: 14px; height: 14px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 4px rgba(0,0,0,0.6);"></div>',
                    iconSize: [14, 14],
                    iconAnchor: [7, 7]
                });

                markerOrigen = L.marker([origenPunto.lat, origenPunto.lng], {icon: redIcon}).addTo(map)
                    .bindPopup('<b>📍 Tu Ubicación</b>').openPopup();
                markerDestino = L.marker([destinoPunto.lat, destinoPunto.lng]).addTo(map)
                    .bindPopup('<b>Destino</b>').openPopup();

                map.setView(origenPunto, 1);

                document.querySelector(".control-panel").style.display = "none";
                var mensajeDestino = notaParam ? decodeURIComponent(notaParam) : "Destino asignado";
                document.getElementById("instruccion").innerHTML = "🧭 Ubicación actual marcada hacia <b>" + mensajeDestino + "</b>.";
                document.querySelector("h2").innerHTML = "📍 Puntos de Referencia";
            }
        };
    </script>
</body>
</html>
