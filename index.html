<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Localizador con QR Interactivo - Puesto 2 (Soles del Oeste)</title>
    <!-- Librería para generar el código QR de forma local -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 10px;
            text-align: center;
        }
        h2 {
            color: #1a252f;
            font-size: 1.1rem;
            margin: 10px 0;
        }
        .instruction-box {
            background: #e8f8f5;
            color: #117a65;
            padding: 8px 12px;
            border-radius: 6px;
            border: #a3e4d7 1px solid;
            display: inline-block;
            margin-bottom: 10px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .control-box {
            background: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 10px;
            display: inline-block;
        }
        button {
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 5px;
            border: none;
            background: #27ae60;
            color: white;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover {
            background: #219653;
        }
        #mapa-container {
            position: relative;
            display: inline-block;
            max-width: 100%;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
            cursor: crosshair;
        }
        #plano {
            width: 100%;
            max-width: 500px;
            height: auto;
            display: block;
        }
        #pin {
            position: absolute;
            width: 18px;
            height: 18px;
            background: #e74c3c;
            border: 2px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            display: none;
            box-shadow: 0 0 10px rgba(0,0,0,0.9);
            z-index: 10;
            pointer-events: none;
        }
        #qr-container {
            margin-top: 15px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            max-width: 300px;
            margin-left: auto;
            margin-right: auto;
            display: none;
        }
        #qrcode {
            margin: 10px auto;
            display: flex;
            justify-content: center;
        }
        #resultado-texto {
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <h2>📍 Localizador y Guía QR - Puesto 2</h2>
    
    <div class="instruction-box" id="instruccion">
        👆 Haz clic en el plano donde va el visitante y presiona generar QR.
    </div>

    <div>
        <div id="mapa-container" onclick="marcarPunto(event)">
            <img id="plano" src="1000043402_2.jpg" alt="Plano Soles del Oeste">
            <div id="pin"></div>
        </div>
    </div>

    <div class="control-box" id="panel-control" style="max-width: 400px; margin: 10px auto; display: block;">
        <label for="comentario">Nota para el destino (Opcional):</label><br>
        <input type="text" id="comentario" placeholder="Ej: Visita Manzana / Lote..." style="width: 85%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;">
        <br>
        <button onclick="generarQR()">Generar QR con el Punto Marcado</button>
    </div>

    <!-- Contenedor del código QR -->
    <div id="qr-container">
        <div id="resultado-texto">Destino marcado</div>
        <p style="font-size: 0.8rem; color: #555; margin: 0;">Escanea con el celular para abrir el plano con la ubicación:</p>
        <div id="qrcode"></div>
    </div>

    <script>
        var posX = null;
        var posY = null;

        // Al cargar la página, revisamos si la URL trae coordenadas compartidas (cuando el visitante escanea el QR)
        window.onload = function() {
            var urlParams = new URLSearchParams(window.location.search);
            var xParam = urlParams.get('x');
            var yParam = urlParams.get('y');
            var notaParam = urlParams.get('nota');

            if (xParam !== null && yParam !== null) {
                // Modo Visitante: Ocultamos los controles de la garita y mostramos el pin fijo en el lugar exacto
                posX = parseFloat(xParam);
                posY = parseFloat(yParam);

                var pin = document.getElementById("pin");
                pin.style.left = posX + "%";
                pin.style.top = posY + "%";
                pin.style.display = "block";

                // Modificar la interfaz para el visitante
                document.getElementById("panel-control").style.display = "none";
                var inst = document.getElementById("instruccion");
                inst.style.background = "#d4edda";
                inst.style.color = "#155724";
                inst.style.borderColor = "#c3e6cb";
                
                if (notaParam) {
                    inst.innerHTML = "🎯 Destino del Visitante: " + decodeURIComponent(notaParam);
                } else {
                    inst.innerHTML = "🎯 Este es tu destino indicado por el Puesto 2.";
                }
            }
        };

        // Función para que el guardia marque haciendo clic en la garita
        function marcarPunto(event) {
            // Si ya estamos en modo visitante, no permitimos cambiar los puntos
            var urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('x') !== null) return;

            var container = document.getElementById("mapa-container");
            var rect = container.getBoundingClientRect();
            
            var x = event.clientX - rect.left;
            var y = event.clientY - rect.top;
            
            posX = (x / rect.width) * 100;
            posY = (y / rect.height) * 100;

            var pin = document.getElementById("pin");
            pin.style.left = posX + "%";
            pin.style.top = posY + "%";
            pin.style.display = "block";
            
            document.getElementById("qr-container").style.display = "none";
        }

        // Función para crear el código QR que apunta a la misma web con las coordenadas incrustadas
        function generarQR() {
            if (posX === null || posY === null) {
                alert("Por favor, haz primero clic sobre el plano para marcar el destino.");
                return;
            }

            var nota = document.getElementById("comentario").value.trim();
            
            // Construir la URL actual agregando las coordenadas del punto seleccionado
            var baseUrl = window.location.origin + window.location.pathname;
            var linkFinal = baseUrl + "?x=" + posX.toFixed(2) + "&y=" + posY.toFixed(2);
            
            if (nota !== "") {
                linkFinal += "&nota=" + encodeURIComponent(nota);
            }

            var resultadoTexto = document.getElementById("resultado-texto");
            resultadoTexto.innerHTML = nota !== "" ? "Destino: " + nota : "Destino marcado";

            var qrcodeDiv = document.getElementById("qrcode");
            qrcodeDiv.innerHTML = "";
            
            // Generar el código QR con el enlace web integrado
            new QRCode(qrcodeDiv, {
                text: linkFinal,
                width: 150,
                height: 150
            });

            document.getElementById("qr-container").style.display = "block";
        }
    </script>

</body>
</html>
