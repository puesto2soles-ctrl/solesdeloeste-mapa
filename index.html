<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marcador de Ubicación - Soles del Oeste</title>
    
    <!-- Librería para generar códigos QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 10px; 
            text-align: center; 
            background: #f0f2f5; 
        }
        h2 {
            color: #1a252f;
            font-size: 1.1rem;
            margin: 10px 0;
        }
        .mode-selector-box {
            background: #ffffff;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: inline-block;
            margin-bottom: 10px;
            max-width: 500px;
            width: 90%;
        }
        .mode-selector-box select {
            padding: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 5px;
            border: 1px solid #bdc3c7;
            background: #ecf0f1;
            width: 100%;
            cursor: pointer;
        }
        .instruction-box {
            background: #e8f8f5;
            color: #117a65;
            padding: 8px 10px;
            border-radius: 6px;
            border: #a3e4d7 1px solid;
            display: inline-block;
            margin-bottom: 10px;
            font-size: 0.85rem;
            font-weight: bold;
            max-width: 500px;
        }
        
        #map-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            background: #fff;
            overflow: hidden; 
            cursor: crosshair;
        }

        /* 
           CORRECCIÓN DE ORIENTACIÓN Y NITIDEZ: 
           Como la imagen original está girada de lado, aplicamos rotate(90deg) 
           (o -90deg según el sentido) y forzamos el renderizado nítido de píxeles.
        */
        #map-image {
            width: 100%;
            height: auto;
            display: block;
            transform: rotate(90deg); /* Endereza la imagen guardada */
            margin: 15% 0; /* Compensa el espacio de la rotación */
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
        }

        /* Pines exactos de 6 píxeles */
        .pin {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            border: 2px solid white;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 4px rgba(0,0,0,0.9);
            pointer-events: none;
            z-index: 10;
        }
        .pin-origen { background-color: #e74c3c; } 
        .pin-destino { background-color: #3498db; } 

        .control-panel { 
            margin-top: 15px;
            padding: 12px; 
            background: white; 
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: inline-block;
            max-width: 500px;
            width: 90%;
        }
        button.action-btn {
            padding: 8px 16px;
            font-size: 0.95rem;
            border-radius: 5px;
            border: none;
            background: #27ae60;
            color: white;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
        }
        button.action-btn:hover { background: #219653; }
        button.reset-btn { background: #e74c3c; margin-left: 5px; }
        button.reset-btn:hover { background: #c0392b; }

        #qr-container {
            margin-top: 15px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            max-width: 300px;
            margin-left: auto;
            margin-right: auto;
            display: none;
        }
        #qrcode {
            margin: 10px auto;
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>

    <h2>📍 Marcador de Ubicación - Soles del Oeste</h2>
    
    <div class="mode-selector-box">
        <label for="modoSeleccion" style="font-size: 0.8rem; font-weight: bold; display: block; margin-bottom: 4px; color: #34495e;">¿Qué deseas marcar en el plano?</label>
        <select id="modoSeleccion" onchange="cambiarModo()">
            <option value="origen">🔴 Marcar: Dónde nos encontramos ahora</option>
            <option value="destino">🔵 Marcar: Destino al que nos dirigimos</option>
        </select>
    </div>

    <div class="instruction-box" id="instruccion">
        Haz clic en el plano para colocar el punto de <b>Tu Ubicación Actual</b>.
    </div>

    <div id="map-container" onclick="marcarPunto(event)">
        <img id="map-image" src="1000043402_2.jpg" alt="Plano Soles del Oeste">
    </div>

    <div class="control-panel">
        <label for="comentario" style="font-size: 0.85rem;">Nota para el destino (Opcional):</label><br>
        <input type="text" id="comentario" placeholder="Ej: Manzana / Lote / Propietario..." style="width: 85%; padding: 6px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;">
        <br>
        <button class="action-btn" onclick="generarQR()">Generar QR</button>
        <button class="action-btn reset-btn" onclick="reiniciarRuta()">Limpiar</button>
    </div>

    <div id="qr-container">
        <div id="resultado-texto" style="font-weight: bold; font-size: 0.9rem; color: #2c3e50;">Puntos marcados</div>
        <p style="font-size: 0.80rem; color: #555; margin: 5px 0;">Escanea con el celular:</p>
        <div id="qrcode"></div>
    </div>

    <script>
        let origenPorcentaje = null;
        let destinoPorcentaje = null;

        function cambiarModo() {
            const modo = document.getElementById('modoSeleccion').value;
            const instruccion = document.getElementById('instruccion');
            if (modo === 'origen') {
                instruccion.innerHTML = "Haz clic en el plano para colocar el punto de <b>Tu Ubicación Actual</b>.";
            } else {
                instruccion.innerHTML = "Haz clic en el plano para colocar el punto de <b>Destino</b>.";
            }
        }

        function marcarPunto(event) {
            const img = document.getElementById('map-image');
            const rect = img.getBoundingClientRect();
            
            const xPx = event.clientX - rect.left;
            const yPx = event.clientY - rect.top;
            
            if (xPx < 0 || yPx < 0 || xPx > rect.width || yPx > rect.height) return;

            const xPorcentaje = (xPx / rect.width) * 100;
            const yPorcentaje = (yPx / rect.height) * 100;

            const modo = document.getElementById('modoSeleccion').value;
            const container = document.getElementById('map-container');

            if (modo === 'origen') {
                origenPorcentaje = { x: xPorcentaje, y: yPorcentaje };
                
                const pinAnterior = document.getElementById('pin-origen');
                if (pinAnterior) pinAnterior.remove();

                const pin = document.createElement('div');
                pin.className = 'pin pin-origen';
                pin.style.left = xPorcentaje + '%';
                pin.style.top = yPorcentaje + '%';
                pin.id = 'pin-origen';
                container.appendChild(pin);

            } else {
                destinoPorcentaje = { x: xPorcentaje, y: yPorcentaje };

                const pinAnterior = document.getElementById('pin-destino');
                if (pinAnterior) pinAnterior.remove();

                const pin = document.createElement('div');
                pin.className = 'pin pin-destino';
                pin.style.left = xPorcentaje + '%';
                pin.style.top = yPorcentaje + '%';
                pin.id = 'pin-destino';
                container.appendChild(pin);
            }
        }

        function reiniciarRuta() {
            origenPorcentaje = null;
            destinoPorcentaje = null;
            
            const pinOrigen = document.getElementById('pin-origen');
            const pinDestino = document.getElementById('pin-destino');
            if (pinOrigen) pinOrigen.remove();
            if (pinDestino) pinDestino.remove();

            document.getElementById("qr-container").style.display = "none";
            document.getElementById("comentario").value = "";
            document.getElementById('modoSeleccion').value = "origen";
            cambiarModo();
        }

        function generarQR() {
            if (!origenPorcentaje || !destinoPorcentaje) { 
                alert("Debes marcar tanto tu ubicación actual (rojo) como el destino (azul) antes de generar el QR."); 
                return; 
            }
            var nota = document.getElementById("comentario").value.trim();
            var baseUrl = window.location.origin + window.location.pathname;

            var linkFinal = baseUrl + "?ox=" + origenPorcentaje.x.toFixed(2) + "&oy=" + origenPorcentaje.y.toFixed(2) + 
                          "&dx=" + destinoPorcentaje.x.toFixed(2) + "&dy=" + destinoPorcentaje.y.toFixed(2);
            if (nota !== "") linkFinal += "&nota=" + encodeURIComponent(nota);

            document.getElementById("resultado-texto").innerHTML = "Ubicación y destino" + (nota ? " (" + nota + ")" : "");
            var qrcodeDiv = document.getElementById("qrcode");
            qrcodeDiv.innerHTML = "";
            new QRCode(qrcodeDiv, { text: linkFinal, width: 140, height: 140 });
            document.getElementById("qr-container").style.display = "block";
        }

        window.onload = function() {
            var urlParams = new URLSearchParams(window.location.search);
            var ox = urlParams.get('ox'), oy = urlParams.get('oy');
            var dx = urlParams.get('dx'), dy = urlParams.get('dy');
            var notaParam = urlParams.get('nota');

            if (ox !== null && dx !== null) {
                const container = document.getElementById('map-container');

                const pinO = document.createElement('div');
                pinO.className = 'pin pin-origen';
                pinO.style.left = ox + '%';
                pinO.style.top = oy + '%';
                container.appendChild(pinO);

                const pinD = document.createElement('div');
                pinD.className = 'pin pin-destino';
                pinD.style.left = dx + '%';
                pinD.style.top = dy + '%';
                container.appendChild(pinD);

                document.querySelector(".control-panel").style.display = "none";
                document.querySelector(".mode-selector-box").style.display = "none";
                var mensajeDestino = notaParam ? decodeURIComponent(notaParam) : "Destino asignado";
                document.getElementById("instruccion").innerHTML = "🧭 Ubicación actual marcada hacia <b>" + mensajeDestino + "</b>.";
                document.querySelector("h2").innerHTML = "📍 Puntos de Referencia";
            }
        };
    </script>
</body>
</html>
