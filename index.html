<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Táctico con Ruta - Puesto 2 (Soles del Oeste)</title>
    <!-- Librería para generar el código QR localmente -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 10px;
            text-align: center;
        }
        h2 {
            color: #1a252f;
            font-size: 1.1rem;
            margin: 10px 0;
        }
        .instruction-box {
            background: #e8f8f5;
            color: #117a65;
            padding: 10px 12px;
            border-radius: 6px;
            border: #a3e4d7 1px solid;
            display: inline-block;
            margin-bottom: 10px;
            font-size: 0.9rem;
            font-weight: bold;
            max-width: 450px;
        }
        .control-box {
            background: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 10px;
            display: inline-block;
        }
        button {
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 5px;
            border: none;
            background: #27ae60;
            color: white;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover {
            background: #219653;
        }
        #mapa-container {
            position: relative;
            display: inline-block;
            max-width: 100%;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
            cursor: crosshair;
        }
        #plano {
            width: 100%;
            max-width: 500px;
            height: auto;
            display: block;
        }
        
        /* SVG para dibujar la línea de ruta por encima del mapa */
        #svg-ruta {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        /* PIN ROJO (Destino) */
        #pin-destino {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #e74c3c;
            border: 1.5px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            display: none;
            box-shadow: 0 0 8px rgba(231, 76, 60, 0.9);
            z-index: 10;
            pointer-events: none;
            animation: pulsoRojo 1.5s infinite;
        }

        /* PIN AZUL (Ubicación actual del visitante) */
        #pin-usuario {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #3498db;
            border: 1.5px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            display: none;
            box-shadow: 0 0 8px rgba(52, 152, 219, 0.9);
            z-index: 10;
            pointer-events: none;
            animation: pulsoAzul 1.5s infinite;
        }

        @keyframes pulsoRojo {
            0% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.8); }
            70% { box-shadow: 0 0 0 6px rgba(231, 76, 60, 0); }
            100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); }
        }

        @keyframes pulsoAzul {
            0% { box-shadow: 0 0 0 0 rgba(52, 152, 219, 0.8); }
            70% { box-shadow: 0 0 0 6px rgba(52, 152, 219, 0); }
            100% { box-shadow: 0 0 0 0 rgba(52, 152, 219, 0); }
        }

        #qr-container {
            margin-top: 15px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            max-width: 300px;
            margin-left: auto;
            margin-right: auto;
            display: none;
        }
        #qrcode {
            margin: 10px auto;
            display: flex;
            justify-content: center;
        }
        #resultado-texto {
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <h2>📍 GPS Táctico y Guía - Puesto 2</h2>
    
    <div class="instruction-box" id="instruccion">
        👆 Haz clic en el plano para marcar el **Destino** del visitante.
    </div>

    <div>
        <div id="mapa-container" onclick="manejarClicMapa(event)">
            <img id="plano" src="1000043402_2.jpg" alt="Plano Soles del Oeste">
            
            <!-- SVG que dibuja la línea de ruta -->
            <svg id="svg-ruta">
                <line id="linea-camino" x1="0" y1="0" x2="0" y2="0" stroke="#3498db" stroke-width="2.5" stroke-dasharray="4" style="display:none;" />
            </svg>

            <div id="pin-destino"></div>
            <div id="pin-usuario"></div>
        </div>
    </div>

    <div class="control-box" id="panel-control" style="max-width: 400px; margin: 10px auto; display: block;">
        <label for="comentario">Nota para el destino (Opcional):</label><br>
        <input type="text" id="comentario" placeholder="Ej: Manzana / Lote..." style="width: 85%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;">
        <br>
        <button onclick="generarQR()">Generar QR con Ruta y Destino</button>
    </div>

    <!-- Contenedor del código QR -->
    <div id="qr-container">
        <div id="resultado-texto">Destino marcado</div>
        <p style="font-size: 0.8rem; color: #555; margin: 0;">Escanea con el celular para abrir la ruta GPS:</p>
        <div id="qrcode"></div>
    </div>

    <script>
        var destinoX = null;
        var destinoY = null;
        
        // Coordenadas simuladas/por defecto para el Puesto 2 (punto de partida en el plano)
        // Puedes ajustar estos valores porcentuales (top y left) para que coincidan exactamente con la ubicación del Puesto 2 en tu imagen.
        var inicioX = 85; 
        var inicioY = 50;

        window.onload = function() {
            var urlParams = new URLSearchParams(window.location.search);
            var xParam = urlParams.get('x');
            var yParam = urlParams.get('y');
            var notaParam = urlParams.get('nota');

            if (xParam !== null && yParam !== null) {
                destinoX = parseFloat(xParam);
                destinoY = parseFloat(yParam);

                // Mostrar Pin Rojo de Destino
                var pinDestino = document.getElementById("pin-destino");
                pinDestino.style.left = destinoX + "%";
                pinDestino.style.top = destinoY + "%";
                pinDestino.style.display = "block";

                // Mostrar Pin Azul de Ubicación Inicial (Puesto 2)
                var pinUsuario = document.getElementById("pin-usuario");
                pinUsuario.style.left = inicioX + "%";
                pinUsuario.style.top = inicioY + "%";
                pinUsuario.style.display = "block";

                // Dibujar la línea de ruta entre el Puesto 2 y el Destino
                actualizarLineaRuta(inicioX, inicioY, destinoX, destinoY);

                // Modificar interfaz para el visitante
                document.getElementById("panel-control").style.display = "none";
                var inst = document.getElementById("instruccion");
                inst.style.background = "#d4edda";
                inst.style.color = "#155724";
                inst.style.borderColor = "#c3e6cb";
                
                var mensajeDestino = notaParam ? decodeURIComponent(notaParam) : "Destino asignado";
                inst.innerHTML = "🧭 <b>Ruta Activa:</b> Sigue la línea azul desde el Puesto 2 hasta " + mensajeDestino;
            }
        };

        function manejarClicMapa(event) {
            var urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('x') !== null) return; // Bloquear si es modo visitante

            var container = document.getElementById("mapa-container");
            var rect = container.getBoundingClientRect();
            
            var x = event.clientX - rect.left;
            var y = event.clientY - rect.top;
            
            destinoX = (x / rect.width) * 100;
            destinoY = (y / rect.height) * 100;

            // Marcar el destino en el mapa del guardia
            var pinDestino = document.getElementById("pin-destino");
            pinDestino.style.left = destinoX + "%";
            pinDestino.style.top = destinoY + "%";
            pinDestino.style.display = "block";

            // Mostrar también el punto de partida (Puesto 2) para referencia del guardia
            var pinUsuario = document.getElementById("pin-usuario");
            pinUsuario.style.left = inicioX + "%";
            pinUsuario.style.top = inicioY + "%";
            pinUsuario.style.display = "block";

            // Trazar línea preliminar
            actualizarLineaRuta(inicioX, inicioY, destinoX, destinoY);
            
            document.getElementById("qr-container").style.display = "none";
        }

        function actualizarLineaRuta(x1Pct, y1Pct, x2Pct, y2Pct) {
            var container = document.getElementById("mapa-container");
            var img = document.getElementById("plano");
            
            // Obtener dimensiones reales renderizadas de la imagen
            var width = img.clientWidth;
            var height = img.clientHeight;

            var x1 = (x1Pct / 100) * width;
            var y1 = (y1Pct / 100) * height;
            var x2 = (x2Pct / 100) * width;
            var y2 = (y2Pct / 100) * height;

            var linea = document.getElementById("linea-camino");
            linea.setAttribute("x1", x1);
            linea.setAttribute("y1", y1);
            linea.setAttribute("x2", x2);
            linea.setAttribute("y2", y2);
            linea.style.display = "block";
        }

        function generarQR() {
            if (destinoX === null || destinoY === null) {
                alert("Por favor, haz primero clic sobre el plano para marcar el destino.");
                return;
            }

            var nota = document.getElementById("comentario").value.trim();
            var baseUrl = window.location.origin + window.location.pathname;
            var linkFinal = baseUrl + "?x=" + destinoX.toFixed(2) + "&y=" + destinoY.toFixed(2);
            
            if (nota !== "") {
                linkFinal += "&nota=" + encodeURIComponent(nota);
            }

            var resultadoTexto = document.getElementById("resultado-texto");
            resultadoTexto.innerHTML = nota !== "" ? "Destino: " + nota : "Destino marcado";

            var qrcodeDiv = document.getElementById("qrcode");
            qrcodeDiv.innerHTML = "";
            
            new QRCode(qrcodeDiv, {
                text: linkFinal,
                width: 150,
                height: 150
            });

            document.getElementById("qr-container").style.display = "block";
        }
    </script>

</body>
</html>
