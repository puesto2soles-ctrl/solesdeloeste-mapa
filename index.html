<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Lotes - Puesto 2 (Soles del Oeste)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 10px;
            text-align: center;
        }
        h2 {
            color: #1a252f;
            font-size: 1.1rem;
            margin: 10px 0;
        }
        .control-box {
            background: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 10px;
            display: inline-block;
        }
        select, button {
            padding: 8px 10px;
            margin: 4px;
            font-size: 0.95rem;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            background: #27ae60;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #219653;
        }
        #mapa-container {
            position: relative;
            display: inline-block;
            max-width: 100%;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
        }
        #plano {
            width: 100%;
            max-width: 500px;
            height: auto;
            display: block;
        }
        #pin {
            position: absolute;
            width: 14px;
            height: 14px;
            background: #e74c3c;
            border: 2px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            display: none;
            box-shadow: 0 0 8px rgba(0,0,0,0.9);
            z-index: 10;
        }
        #info-lote {
            margin-top: 10px;
            font-weight: bold;
            color: #2c3e50;
        }
    </style>
</head>
<body>

    <h2>📍 Localizador de Lotes - Puesto 2</h2>
    
    <div class="control-box">
        <label for="manzana">Manzana:</label>
        <select id="manzana" onchange="actualizarLotes()">
            <option value="">Manzana...</option>
            <option value="82">Manz. 82 (85 lotes)</option>
            <option value="83">Manz. 83 (23 lotes)</option>
            <option value="84">Manz. 84 (10 lotes)</option>
            <option value="85">Manz. 85 (23 lotes)</option>
            <option value="86">Manz. 86 (18 lotes)</option>
            <option value="87">Manz. 87 (23 lotes)</option>
            <option value="88">Manz. 88 (29 lotes)</option>
            <option value="89">Manz. 89 (28 lotes)</option>
            <option value="90">Manz. 90 (20 lotes)</option>
            <option value="91">Manz. 91 (7 lotes)</option>
            <option value="92">Manz. 92 (17 lotes)</option>
            <option value="93">Manz. 93 (13 lotes)</option>
            <option value="94">Manz. 94 (18 lotes)</option>
            <option value="95">Manz. 95 (28 lotes)</option>
            <option value="96">Manz. 96 (16 lotes)</option>
        </select>

        <label for="parcela">Lote:</label>
        <select id="parcela">
            <option value="">Lote...</option>
        </select>

        <button onclick="ubicarLote()">Marcar</button>
    </div>

    <div>
        <div id="mapa-container">
            <img id="plano" src="1000043402_2.jpg" alt="Plano Soles del Oeste">
            <div id="pin"></div>
        </div>
        <div id="info-lote"></div>
    </div>

    <script>
        var limitesLotes = {
            "82": 85, "83": 23, "84": 10, "85": 23, "86": 18, 
            "87": 23, "88": 29, "89": 28, "90": 20, "91": 7, 
            "92": 17, "93": 13, "94": 18, "95": 28, "96": 16
        };

        // Coordenadas base principales por manzana (centro aproximado o punto de referencia inicial)
        var coordenadasManzanas = {
            "82": { top: 82, left: 20 },
            "83": { top: 48, left: 82 },
            "84": { top: 72, left: 78 },
            "85": { top: 68, left: 56 },
            "86": { top: 85, left: 42 },
            "87": { top: 58, left: 37 },
            "88": { top: 40, left: 43 },
            "89": { top: 20, left: 43 },
            "90": { top: 20, left: 68 },
            "91": { top: 30, left: 77 },
            "92": { top: 34, left: 62 },
            "93": { top: 42, left: 57 },
            "94": { top: 58, left: 54 },
            "95": { top: 45, left: 76 },
            "96": { top: 70, left: 37 }
        };

        function actualizarLotes() {
            var mz = document.getElementById("manzana").value;
            var selectParcela = document.getElementById("parcela");
            selectParcela.innerHTML = '<option value="">Lote...</option>';
            
            if (mz !== "" && limitesLotes[mz]) {
                var total = limitesLotes[mz];
                for (var i = 1; i <= total; i++) {
                    var opt = document.createElement("option");
                    opt.value = i;
                    opt.innerHTML = "Lote " + i;
                    selectParcela.appendChild(opt);
                }
            }
        }

        function ubicarLote() {
            var mz = document.getElementById("manzana").value;
            var parcela = parseInt(document.getElementById("parcela").value);
            var pin = document.getElementById("pin");
            var infoLote = document.getElementById("info-lote");
            
            if (mz === "" || isNaN(parcela)) {
                alert("Por favor selecciona una manzana y un lote válido.");
                pin.style.display = "none";
                infoLote.innerHTML = "";
                return;
            }

            var base = coordenadasManzanas[mz];

            if (base) {
                // Desplazamiento dinámico suave según el número de lote para evitar que caigan todos en el mismo lugar exacto
                var offsetX = (parcela % 5) * 0.8;
                var offsetY = Math.floor(parcela / 5) * 0.8;

                var topFinal = base.top + offsetY;
                var leftFinal = base.left + offsetX;

                pin.style.top = topFinal + "%";
                pin.style.left = leftFinal + "%";
                pin.style.display = "block";

                infoLote.innerHTML = "Mostrando: Manzana " + mz + " - Lote " + parcela;
            } else {
                alert("Manzana no encontrada.");
                pin.style.display = "none";
                infoLote.innerHTML = "";
            }
        }
    </script>

</body>
</html>
