<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navegador Inteligente - Soles del Oeste (Puesto 2)</title>
    
    <!-- 1. Estilos CSS de Leaflet (Mapas Libres) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 10px; 
            text-align: center; 
            background: #f0f2f5; 
        }
        h2 {
            color: #1a252f;
            font-size: 1.1rem;
            margin: 10px 0;
        }
        .instruction-box {
            background: #e8f8f5;
            color: #117a65;
            padding: 10px 12px;
            border-radius: 6px;
            border: #a3e4d7 1px solid;
            display: inline-block;
            margin-bottom: 10px;
            font-size: 0.9rem;
            font-weight: bold;
            max-width: 450px;
        }
        #map { 
            width: 100%; 
            max-width: 600px; 
            height: 70vh; 
            margin: 0 auto; 
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .control-panel { 
            margin-top: 15px;
            padding: 10px; 
            background: white; 
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: inline-block;
            max-width: 400px;
        }
    </style>
</head>
<body>

    <h2>📍 Navegador Automático - Puesto 2 (Soles del Oeste)</h2>
    
    <div class="instruction-box" id="instruccion">
        🎯 <b>Paso 1 Iniciado:</b> Cargando la base cartográfica y la superposición del plano de Soles del Oeste.
    </div>

    <!-- Contenedor del Mapa -->
    <div id="map"></div>

    <div class="control-panel">
        <p style="font-size: 0.85rem; color: #555; margin: 0;">Próximamente: Selección de origen, destino y generación de QR automático.</p>
    </div>

    <!-- 2. Script principal de Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inicializar el mapa centrado de manera aproximada en Soles del Oeste, Río Cuarto
        var map = L.map('map', {
            crs: L.CRS.Simple, // Usamos CRS.Simple para mapear coordenadas de imagen plana con precisión absoluta
            minZoom: -2,
            maxZoom: 3
        });

        // Dimensiones de referencia de tu imagen (1000043402_2.jpg)
        // Definimos un plano cartesiano virtual para que encaje perfecto
        var w = 1000; 
        var h = 1400;
        var bounds = [[0, 0], [h, w]];

        // Superponer tu imagen personalizada exactamente sobre el contenedor del mapa
        var overlay = L.imageOverlay('1000043402_2.jpg', bounds).addTo(map);

        // Ajustar la vista del mapa para que muestre toda la imagen de forma limpia
        map.fitBounds(bounds);

        // Mensaje de éxito al cargar
        console.log("Mapa e imagen superpuesta cargados correctamente.");
    </script>
</body>
</html>
